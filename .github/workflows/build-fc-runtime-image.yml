name: Build and Push FC Runtime Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish to Aliyun Container Registry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-fc-runtime-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push FC runtime image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.FASTGPT_ALI_IMAGE_USER }}
          password: ${{ secrets.FASTGPT_ALI_IMAGE_PSW }}

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Build and push FC runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/infrastructure/src/plugin/plugin-runtime/drivers/serverless/FC/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ secrets.FASTGPT_ALI_IMAGE_PREFIX }}/fastgpt-plugin-fc-runtime:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=FastGPT Plugin Aliyun FC runtime image
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          cache-from: type=gha,scope=fc-runtime-image
          cache-to: type=gha,mode=max,scope=fc-runtime-image
